<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador Meteorológico Operativo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; }
        .controls { background: #2d2d2d; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: flex; flex-wrap: wrap; gap: 15px; }
        .card { background: #333; padding: 10px; border-radius: 8px; flex: 1; min-width: 300px; }
        img { max-width: 100%; height: auto; border-radius: 4px; }
        input[type="range"] { width: 100%; margin-top: 15px; cursor: pointer; }
        h3 { margin-top: 0; font-size: 16px; color: #4CAF50; }
        .info { font-size: 14px; color: #aaa; margin-top: 5px; word-break: break-all;}
        
        /* Pequeña etiqueta para distinguir qué imágenes están fijas */
        .badge { background-color: #4CAF50; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; float: right;}
    </style>
</head>
<body>

    <div class="controls">
        <h2>🌤️ Visualizador Meteorológico (Modo Persistencia)</h2>
        <p>Selecciona tu carpeta. El WRF se mantendrá fijo por hora, mientras puedes observar la evolución del radar y satélite en los minutos intermedios.</p>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
        
        <div id="sliderContainer" style="display: none; margin-top: 20px;">
            <p><strong>Tiempo de Observación: </strong> <span id="timeDisplay" style="color:#4CAF50; font-weight:bold; font-size:18px;"></span></p>
            <input type="range" id="timeSlider" min="0" max="0" value="0">
        </div>
    </div>

    <div class="grid" id="imageGrid">
        </div>

    <script>
        // Separamos los diccionarios: uno para observaciones (radar/sat) y otro para pronósticos (WRF)
        let radarSatPorTiempo = {}; // Se agrupa por "HH:MM"
        let wrfPorHora = {};        // Se agrupa solo por "HH"
        let tiemposOrdenados = [];

        function redondearMinutos(minutos) {
            // Agrupamos el radar y satélite cada 15 minutos para que coincidan entre sí
            return Math.round(minutos / 15) * 15;
        }

        document.getElementById('folderInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files).filter(f => !f.name.startsWith('.') && (f.name.endsWith('.png') || f.name.endsWith('.jpg')));
            
            radarSatPorTiempo = {};
            wrfPorHora = {};
            let tiemposDisponibles = new Set();
            
            files.forEach(file => {
                const matchHora = file.name.match(/_(\d{4,6})(?:Z|_|\.)/); 
                const matchWrf = file.name.match(/_(\d{2})UTC_(\d{3})/i); 

                if (matchWrf) {
                    // LÓGICA PARA EL WRF (Solo extraemos la HORA válida)
                    let initHour = parseInt(matchWrf[1], 10);
                    let leadTime = parseInt(matchWrf[2], 10);
                    let validHour = (initHour + leadTime) % 24; 
                    
                    let hh = validHour.toString().padStart(2, '0');
                    
                    if (!wrfPorHora[hh]) wrfPorHora[hh] = [];
                    wrfPorHora[hh].push(file);
                    
                    // Nos aseguramos de que el deslizador tenga una "parada" en la hora en punto
                    tiemposDisponibles.add(`${hh}:00`); 
                    
                } else if (matchHora) {
                    // LÓGICA PARA RADAR Y SATÉLITE (Extraemos HORA y MINUTO)
                    let hhStr = matchHora[1].substring(0, 2);
                    let mmStr = matchHora[1].substring(2, 4);
                    
                    let mins = redondearMinutos(parseInt(mmStr, 10));
                    let hh = parseInt(hhStr, 10);
                    
                    if (mins >= 60) {
                        mins = 0;
                        hh = (hh + 1) % 24;
                    }
                    
                    let hhFinal = hh.toString().padStart(2, '0');
                    let mmFinal = mins.toString().padStart(2, '0');
                    let tiempoObs = `${hhFinal}:${mmFinal}`;

                    if (!radarSatPorTiempo[tiempoObs]) radarSatPorTiempo[tiempoObs] = [];
                    radarSatPorTiempo[tiempoObs].push(file);

                    tiemposDisponibles.add(tiempoObs);
                }
            });

            // Ordenamos todos los tiempos encontrados (ej. 10:00, 10:15, 10:30, 11:00...)
            tiemposOrdenados = Array.from(tiemposDisponibles).sort();
            
            if (tiemposOrdenados.length > 0) {
                const slider = document.getElementById('timeSlider');
                slider.max = tiemposOrdenados.length - 1;
                slider.value = 0;
                document.getElementById('sliderContainer').style.display = 'block';
                actualizarVista(0);
            } else {
                alert("No se encontraron timestamps válidos.");
            }
        });

        document.getElementById('timeSlider').addEventListener('input', function(e) {
            actualizarVista(e.target.value);
        });

        function actualizarVista(index) {
            const tiempoActual = tiemposOrdenados[index]; // ej: "10:15"
            document.getElementById('timeDisplay').innerText = tiempoActual + " UTC";
            
            const hhActual = tiempoActual.split(':')[0]; // Extraemos solo el "10" para buscar el WRF
            
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = ''; 

            let archivosAMostrar = [];

            // 1. Cargamos el WRF fijo para esa hora
            if (wrfPorHora[hhActual]) {
                archivosAMostrar = archivosAMostrar.concat(wrfPorHora[hhActual]);
            }

            // 2. Cargamos las observaciones de ese minuto específico
            if (radarSatPorTiempo[tiempoActual]) {
                archivosAMostrar = archivosAMostrar.concat(radarSatPorTiempo[tiempoActual]);
            }
            
            archivosAMostrar.forEach(file => {
                const imgUrl = URL.createObjectURL(file);
                const card = document.createElement('div');
                card.className = 'card';
                
                let titulo = "Imagen";
                let badge = "";
                let upperName = file.name.toUpperCase();
                
                if(upperName.includes('WRF')) {
                    titulo = "Modelo WRF";
                    // Etiqueta visual para indicar que esta imagen se mantiene por toda la hora
                    badge = `<span class="badge">Fijo para las ${hhActual}:00Z</span>`; 
                }
                else if(upperName.includes('RMA')) titulo = "Radar RMA";
                else if(upperName.includes('GLM')) titulo = "Rayos GLM";
                else if(upperName.includes('AIRMASS') || upperName.includes('TOP')) titulo = "Satélite GOES";

                card.innerHTML = `
                    <h3>${titulo} ${badge}</h3>
                    <img src="${imgUrl}" alt="${file.name}">
                    <div class="info">${file.name}</div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
