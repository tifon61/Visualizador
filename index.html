<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador Meteorológico</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; }
        .controls { background: #2d2d2d; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: flex; flex-wrap: wrap; gap: 15px; }
        .card { background: #333; padding: 10px; border-radius: 8px; flex: 1; min-width: 300px; }
        img { max-width: 100%; height: auto; border-radius: 4px; }
        input[type="range"] { width: 100%; margin-top: 15px; }
        h3 { margin-top: 0; font-size: 16px; color: #4CAF50; }
        .info { font-size: 14px; color: #aaa; margin-top: 5px; word-break: break-all;}
    </style>
</head>
<body>

    <div class="controls">
        <h2>🌤️ Visualizador Meteorológico HTML (Con Tolerancia)</h2>
        <p>Selecciona la carpeta. Las imágenes se agruparán automáticamente en bloques de 15 minutos.</p>
        <input type="file" id="folderInput" webkitdirectory directory multiple>
        
        <div id="sliderContainer" style="display: none; margin-top: 20px;">
            <p><strong>Hora agrupada (Bloques de 15m): </strong> <span id="timeDisplay" style="color:#4CAF50; font-weight:bold; font-size:18px;"></span></p>
            <input type="range" id="timeSlider" min="0" max="0" value="0">
        </div>
    </div>

    <div class="grid" id="imageGrid">
        </div>

    <script>
        let archivosAgrupados = {}; 
        let tiemposOrdenados = [];

        // Función para redondear al bloque de 15 minutos más cercano
        function redondearHora(hh, mm) {
            let minutosTotales = (parseInt(hh) * 60) + parseInt(mm);
            let bloque15 = Math.round(minutosTotales / 15) * 15; // Cambia este 15 a 10 o 30 si prefieres otros intervalos
            
            let nuevaHora = Math.floor(bloque15 / 60);
            let nuevosMinutos = bloque15 % 60;
            
            // Si se pasa de 23:59, vuelve a 00 (para el final del día)
            if (nuevaHora >= 24) nuevaHora = 0;

            // Formatear a HH:MM
            let horaStr = nuevaHora.toString().padStart(2, '0');
            let minStr = nuevosMinutos.toString().padStart(2, '0');
            return `${horaStr}:${minStr} UTC`;
        }

        document.getElementById('folderInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files).filter(f => f.name.endsWith('.png') || f.name.endsWith('.jpg'));
            archivosAgrupados = {};
            
            files.forEach(file => {
                // Buscamos patrones de hora
                const matchHora = file.name.match(/_(\d{4,6})(?:Z|_|\.)/); 
                const matchWrf = file.name.match(/18UTC_(\d{3})/); // Adaptación simple para WRF

                let tiempoClave = null;
                
                if (matchHora) {
                    let hh = matchHora[1].substring(0, 2);
                    let mm = matchHora[1].substring(2, 4);
                    // Aplicamos el redondeo para crear la "ventana de tiempo"
                    tiempoClave = redondearHora(hh, mm);
                } else if (matchWrf) {
                    // Para tu WRF, asumiendo que el nombre no tiene la hora exacta en HHMM, 
                    // lo agrupamos temporalmente por su timestep o prefijo si no coincide.
                    // (Si tus cartas WRF tuvieran la hora exacta, usaríamos la misma lógica de arriba).
                    tiempoClave = `WRF Step ${matchWrf[1]}`; 
                }

                if (tiempoClave) {
                    if (!archivosAgrupados[tiempoClave]) {
                        archivosAgrupados[tiempoClave] = [];
                    }
                    archivosAgrupados[tiempoClave].push(file);
                }
            });

            tiemposOrdenados = Object.keys(archivosAgrupados).sort();
            
            if (tiemposOrdenados.length > 0) {
                const slider = document.getElementById('timeSlider');
                slider.max = tiemposOrdenados.length - 1;
                slider.value = 0;
                document.getElementById('sliderContainer').style.display = 'block';
                actualizarVista(0);
            } else {
                alert("No se encontraron timestamps válidos.");
            }
        });

        document.getElementById('timeSlider').addEventListener('input', function(e) {
            actualizarVista(e.target.value);
        });

        function actualizarVista(index) {
            const tiempoActual = tiemposOrdenados[index];
            document.getElementById('timeDisplay').innerText = tiempoActual;
            
            const grid = document.getElementById('imageGrid');
            grid.innerHTML = ''; 

            const archivosDelTiempo = archivosAgrupados[tiempoActual];
            
            archivosDelTiempo.forEach(file => {
                const imgUrl = URL.createObjectURL(file);
                const card = document.createElement('div');
                card.className = 'card';
                
                let titulo = "Imagen";
                if(file.name.includes('WRF')) titulo = "Modelo WRF";
                else if(file.name.includes('RMA')) titulo = "Radar RMA";
                else if(file.name.includes('glm')) titulo = "Rayos GLM";
                else if(file.name.includes('AIRMASS') || file.name.includes('TOP')) titulo = "Satélite GOES";

                card.innerHTML = `
                    <h3>${titulo}</h3>
                    <img src="${imgUrl}" alt="${file.name}">
                    <div class="info">${file.name}</div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
